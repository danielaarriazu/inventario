name: Mantener el servidor despierto en horario laboral

on:
  # Corre solo, cada 10 minutos, de lunes a viernes de 8 a 15 hs (hora
  # Argentina). Los horarios de GitHub Actions siempre son en UTC, y
  # Argentina está en UTC-3 todo el año (no tiene horario de verano),
  # así que 8-15 hs ahí es 11-18 hs UTC.
  schedule:
    - cron: '*/10 11-17 * * 1-5'
  # Para poder probarlo a mano desde la pestaña "Actions" de GitHub,
  # sin esperar al horario programado
  workflow_dispatch:

jobs:
  despertar:
    runs-on: ubuntu-latest
    steps:
      - name: Pegarle al servidor para que no se duerma
        run: |
          curl -sf https://inventario-backend-inic.onrender.com/api/status \
            && echo "Servidor respondió OK" \
            || echo "No respondió — no pasa nada, el próximo ping lo intenta de nuevo"
