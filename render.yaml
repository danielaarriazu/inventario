services:
  - type: web
    name: inventario-backend
    env: node
    plan: free
    rootDir: inventario-back
    buildCommand: npm install && npm run build && npx prisma db push
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        value: https://inventario-wju6.onrender.com

  - type: web
    name: inventario-frontend
    runtime: static
    rootDir: inventario-front
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://inventario-backend.onrender.com/api