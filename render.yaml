services:
  - type: web
    name: inventario-backend
    env: node
    plan: free
    rootDir: inventario-back
    # Compila el frontend primero (queda en inventario-front/dist), después
    # compila y prepara el backend, que sirve ambas cosas desde un mismo servicio
    buildCommand: cd ../inventario-front && npm install && npm run build && cd ../inventario-back && npm install && npx prisma generate && npm run build && npx prisma db push
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        value: https://inventario-backend.onrender.com