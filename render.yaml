services:
  - type: web
    name: inventario-backend
    env: node
    plan: free
    rootDir: inventario-back
    # Compila el frontend, copia el resultado ADENTRO de inventario-back
    # (a public/) porque todo lo que quede afuera del rootDir no sobrevive
    # al runtime en Render, y recién ahí compila y prepara el backend
    buildCommand: cd ../inventario-front && npm install && npm run build && cd ../inventario-back && rm -rf public && cp -r ../inventario-front/dist ./public && npm install && npx prisma generate && npm run build && npx prisma db push
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        value: https://inventario-backend.onrender.com